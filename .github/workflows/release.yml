name: Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Extract Release Version
        id: get_version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "TAG=$TAG_NAME" >> $GITHUB_OUTPUT
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from version import __version__, __protocol_version__
              print(f'Server Version: {__version__}, Protocol: {__protocol_version__}')
          except Exception as e:
              print(f'Version read error: {e}')
          "

      - name: Create Production Release Archive
        run: |
          ARCHIVE_NAME="ind-project-server-${{ steps.get_version.outputs.TAG }}.tar.gz"
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='scratch' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='tests' \
              --exclude='test_*.py' \
              -czf "$ARCHIVE_NAME" .
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
